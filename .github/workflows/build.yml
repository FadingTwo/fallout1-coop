name: Build

# Builds the Linux and Windows packages the same way releases are made
# (tools/build-release.sh, cross-compiled with zig). The packages are
# attached to the run. No server is built in; see docs/coop/SERVER.md.

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev
          pip install ziglang==0.16.0
          # Ubuntu keeps SDL's real config header in the multiarch include
          # directory, which zig doesn't search: one directory with both.
          cp -r /usr/include/SDL2 "$RUNNER_TEMP/sdl2"
          cp /usr/include/x86_64-linux-gnu/SDL2/_real_SDL_config.h "$RUNNER_TEMP/sdl2/SDL_config.h"

      - name: Build
        run: |
          SDL2_INCLUDE_DIRS="$RUNNER_TEMP/sdl2" \
          SDL2_LIBRARIES=/usr/lib/x86_64-linux-gnu/libSDL2.so \
          tools/build-release.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.zip
